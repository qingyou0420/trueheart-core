name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run Ruff check
        run: python -m ruff check src/trueheart_core tests examples
      - name: Run Ruff format check
        run: python -m ruff format --check src/trueheart_core tests examples
      - name: Run mypy
        run: python -m mypy src/trueheart_core
      - name: Build distributions
        run: python -m build
      - name: Reinstall wheel
        run: python -m pip install --force-reinstall dist/trueheart_core-0.1.0-py3-none-any.whl
      - name: Run installed example
        run: python examples/basic_memory.py
