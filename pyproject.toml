[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trueheart-core"
version = "0.1.1"
description = "Governed long-term memory contracts for AI agents"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qingyou0420" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/qingyou0420/trueheart-core"
Source = "https://github.com/qingyou0420/trueheart-core"
Issues = "https://github.com/qingyou0420/trueheart-core/issues"
Security = "https://github.com/qingyou0420/trueheart-core/security/policy"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trueheart_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
strict = true
