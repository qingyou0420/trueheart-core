[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trueheart-core"
version = "0.1.0"
description = "Governed long-term memory contracts for AI agents"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qingyou0420" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
strict = true
